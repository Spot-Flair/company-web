<style>
/* Layout concept: "In focus". Navy night bands and white paper bands alternate like a lens pulling focus.
   Shapes are only circles (the Spotflair ring, pills) and sharp frames (images, panels). Responsive rules use
   container queries on .site, so the review bar can preview 375 / 768 / 1440 widths for real. */
:root{
  /* Colour — brand */
  --coral:#E55641;          /* brand coral. Fills, rings, large text (3.66:1 on white, large/UI only) */
  --coral-text:#B63A25;     /* coral for small text on light (5.80:1 on white) */
  --coral-on-night:#F0735F; /* coral text on navy (5.30:1 on #202630) */
  --on-coral:#12161D;       /* text on coral fills (4.96:1) */
  --navy:#202630;           /* brand navy */
  /* Colour — surfaces & text (light) */
  --paper:#FFFFFF;
  --paper-2:#F4F5F7;
  --tint:#FDECE8;           /* coral tint surface; navy text 13.28:1, coral-text 5.06:1 */
  --ink:#202630;            /* body text 15.2:1 on white */
  --muted:#535C6B;          /* secondary text 6.75:1 on white, 6.19:1 on paper-2 */
  --line:#D8DCE2;           /* decorative hairlines */
  --line-strong:#8A929F;    /* input borders, 3.14:1 on white (UI) */
  --night:#202630;          /* dark band */
  --night-2:#2A313D;
  --night-text:#FFFFFF;     /* 15.2:1 */
  --night-muted:#A9B0BC;    /* 6.97:1 on night */
  --night-line:#3A4250;
  /* Semantic */
  --success:#1F7A4D; --error:#B42318; --warning:#8A5A00; --info:#2457A6;
  --stage:#E6E8EC;
  /* Type */
  --f-display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-text:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* Spacing (4px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  /* Radius: only three shapes */
  --r-frame:0; --r-field:6px; --r-panel:14px; --r-pill:999px;
  /* Elevation */
  --sh-1:0 1px 2px rgba(18,22,29,.08);
  --sh-2:0 18px 40px -18px rgba(18,22,29,.35);
  --sh-3:0 30px 80px -30px rgba(18,22,29,.5);
  /* Motion */
  --ease-focus:cubic-bezier(.2,.8,.2,1);
  --ease-move:cubic-bezier(.65,0,.35,1);
  --d-micro:120ms; --d-ui:240ms; --d-reveal:520ms; --d-hero:900ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --coral:#E55641; --coral-text:#F0735F; --coral-on-night:#F0735F; --on-coral:#12161D; --navy:#202630;
    --paper:#12161D; --paper-2:#1A1F28; --tint:#2A1C1A; --ink:#EEF0F3; --muted:#9AA3B1;
    --line:#2A313D; --line-strong:#6E7684; --night:#0B0E13; --night-2:#161B23; --night-text:#EEF0F3;
    --night-muted:#9AA3B1; --night-line:#262D38;
    --success:#4ADE80; --error:#F97066; --warning:#F5B547; --info:#7FA8F0; --stage:#07090C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --coral:#E55641; --coral-text:#F0735F; --coral-on-night:#F0735F; --on-coral:#12161D; --navy:#202630;
  --paper:#12161D; --paper-2:#1A1F28; --tint:#2A1C1A; --ink:#EEF0F3; --muted:#9AA3B1;
  --line:#2A313D; --line-strong:#6E7684; --night:#0B0E13; --night-2:#161B23; --night-text:#EEF0F3;
  --night-muted:#9AA3B1; --night-line:#262D38;
  --success:#4ADE80; --error:#F97066; --warning:#F5B547; --info:#7FA8F0; --stage:#07090C;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.6;margin:0;padding-bottom:88px}
img,svg,video{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
p{margin:0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.05;letter-spacing:-.025em;text-wrap:balance;font-weight:600}
ul,ol{margin:0;padding:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Focus — signature: the Spotflair ring */
:focus{outline:none}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;box-shadow:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:2px;box-shadow:0 0 0 6px color-mix(in srgb, var(--coral) 22%, transparent)}
.night :focus-visible{outline-color:var(--coral-on-night)}

.skip{position:fixed;left:max(12px, env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:200;background:var(--coral);color:var(--on-coral);padding:12px 20px;border-radius:var(--r-pill);font-weight:700;transform:translateY(-200%);transition:transform var(--d-ui) var(--ease-focus);text-decoration:none}
.skip:focus{transform:none}

/* Stage + site container (enables true width previews) */
.stage{display:flex;justify-content:center;min-height:100vh}
.site{width:100%;max-width:var(--pw,none);background:var(--paper);container:site / inline-size;position:relative;transition:max-width var(--d-ui) var(--ease-move)}
html.previewing .site{box-shadow:var(--sh-3);outline:1px solid var(--line)}
.wrap{width:100%;max-width:1360px;margin-inline:auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
@container site (min-width: 760px){ .wrap{padding-left:max(32px, env(safe-area-inset-left,0px));padding-right:max(32px, env(safe-area-inset-right,0px))} }
@container site (min-width: 1200px){ .wrap{padding-left:max(80px, env(safe-area-inset-left,0px));padding-right:max(80px, env(safe-area-inset-right,0px))} }

/* Bands */
.band{padding-block:clamp(64px, 9cqi, 128px)}
.band.tight{padding-block:clamp(48px, 6cqi, 88px)}
.night{background:var(--night);color:var(--night-text)}
.night .muted{color:var(--night-muted)}
.soft{background:var(--paper-2)}
.tinted{background:var(--tint)}

/* Type scale */
.t-display{font-size:clamp(2.6rem, .9rem + 8.4cqi, 8.25rem);line-height:.94;letter-spacing:-.045em;font-weight:600}
.t-1{font-size:clamp(2.25rem, 1.1rem + 4.6cqi, 5rem);line-height:1;letter-spacing:-.035em}
.t-2{font-size:clamp(1.75rem, 1.15rem + 2.4cqi, 3.25rem);line-height:1.05}
.t-3{font-size:clamp(1.3rem, 1.05rem + .9cqi, 1.75rem);line-height:1.2;letter-spacing:-.015em}
.t-4{font-size:1.125rem;line-height:1.3;letter-spacing:-.01em}
.lead{font-size:clamp(1.08rem, .98rem + .5cqi, 1.3rem);line-height:1.55;max-width:60ch}
.small{font-size:.875rem;line-height:1.5}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.eyebrow::before{content:"";width:12px;height:12px;border:2px solid var(--coral);border-radius:50%;flex:none}
.night .eyebrow::before{border-color:var(--coral-on-night)}
.prose{max-width:66ch}
.prose p+p{margin-top:1em}
.c-coral{color:var(--coral-text)}
.night .c-coral{color:var(--coral-on-night)}
.num{font-variant-numeric:tabular-nums}

/* Signature 2: the Trail — tapered comet stroke from the logo */
.trail{position:relative;white-space:nowrap}
.trail::after{content:"";position:absolute;left:-.05em;right:-.1em;bottom:-.06em;height:.16em;background:var(--coral);clip-path:polygon(0 70%,100% 0,100% 100%,0 100%);transform-origin:right;transition:transform var(--d-hero) var(--ease-focus)}
.night .trail::after{background:var(--coral-on-night)}
.pre .trail::after,.trail.pre::after{transform:scaleX(0)}

/* Buttons */
.btn{--bh:48px;display:inline-flex;text-align:center;align-items:center;justify-content:center;gap:10px;min-height:var(--bh);padding:0 22px;border-radius:var(--r-pill);font-weight:600;font-size:1rem;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:background var(--d-ui) var(--ease-focus),color var(--d-ui),border-color var(--d-ui),transform var(--d-micro);line-height:1.15;padding-block:8px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--coral);color:var(--on-coral)}
.btn-primary:hover{background:color-mix(in srgb, var(--coral) 85%, #000)}
.btn-primary .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;transition:transform var(--d-ui) var(--ease-focus)}
.btn-primary:hover .dot{transform:scale(1.5)}
.btn-ghost{border-color:currentColor;background:transparent}
.btn-ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.night .btn-ghost:hover{background:var(--night-text);color:var(--night);border-color:var(--night-text)}
.btn-sm{--bh:44px;padding:0 18px;font-size:.92rem}
.btn-lg{--bh:58px;padding:0 30px;font-size:1.06rem}
.btn-block{width:100%}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;min-height:44px;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 10px)/0 2px no-repeat;transition:background-size var(--d-ui) var(--ease-focus)}
.link:hover{background-size:100% 2px}
.link svg{transition:transform var(--d-ui) var(--ease-focus)}
.link:hover svg{transform:translateX(4px)}
.textlink{color:var(--coral-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.night .textlink{color:var(--coral-on-night)}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line-strong);font-size:.88rem;background:transparent;line-height:1.2}
.night .chip{border-color:var(--night-line)}
button.chip,label.chip{min-height:44px;cursor:pointer}
.chip[aria-pressed="true"],.chip.on,input:checked+.chip{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"]::before,input:checked+.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.night .tag{color:var(--night-muted)}

/* Placeholders (image + content) */
.ph{position:relative;aspect-ratio:var(--ar,4/3);max-width:100%;background:
  linear-gradient(var(--line),var(--line)) 12px 12px/22px 2px no-repeat,
  linear-gradient(var(--line),var(--line)) 12px 12px/2px 22px no-repeat,
  linear-gradient(var(--line),var(--line)) calc(100% - 12px) calc(100% - 12px)/22px 2px no-repeat,
  linear-gradient(var(--line),var(--line)) calc(100% - 12px) calc(100% - 12px)/2px 22px no-repeat,
  repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--line) 55%, transparent) 14px 15px),
  var(--paper-2);display:flex;align-items:flex-end;overflow:hidden;border-radius:var(--r-frame)}
.night .ph{background:
  linear-gradient(var(--night-line),var(--night-line)) 12px 12px/22px 2px no-repeat,
  linear-gradient(var(--night-line),var(--night-line)) 12px 12px/2px 22px no-repeat,
  linear-gradient(var(--night-line),var(--night-line)) calc(100% - 12px) calc(100% - 12px)/22px 2px no-repeat,
  linear-gradient(var(--night-line),var(--night-line)) calc(100% - 12px) calc(100% - 12px)/2px 22px no-repeat,
  repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--night-line) 70%, transparent) 14px 15px),
  var(--night-2)}
.ph .cap{font-family:var(--f-mono);font-size:.72rem;line-height:1.45;padding:14px 16px;color:var(--muted);max-width:44ch}
.night .ph .cap{color:var(--night-muted)}
.ph .ring{position:absolute;left:50%;top:46%;width:22%;aspect-ratio:1;border:2px solid var(--coral);border-radius:50%;transform:translate(-50%,-50%);opacity:.9}
.phx{overflow-wrap:anywhere;font-family:var(--f-mono);font-size:.82em;background:color-mix(in srgb, var(--coral) 12%, transparent);color:var(--coral-text);padding:.05em .4em;border-radius:4px;white-space:normal;letter-spacing:0;font-weight:500;text-transform:none}
.night .phx{color:var(--coral-on-night);background:color-mix(in srgb, var(--coral-on-night) 14%, transparent)}
h1 .phx,h2 .phx,h3 .phx{font-size:.5em;vertical-align:middle}

/* Iris reveal (signature 1 in motion) */
.iris{clip-path:circle(150% at 50% 50%);transition:clip-path var(--d-hero) var(--ease-focus)}
.iris.pre{clip-path:circle(10% at 50% 50%)}
.rise{transition:transform var(--d-reveal) var(--ease-focus),opacity var(--d-reveal) var(--ease-focus)}
.rise.pre{transform:translateY(24px);opacity:.001}

.t-display{text-wrap:balance}
.go{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;transition:all var(--d-ui) var(--ease-focus)}
.roles a:hover .go{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.roles .go{display:none}
@container site (min-width: 760px){ .roles .go{display:grid} }
.dl .pm{width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;flex:none;position:relative}
.dl .pm::before,.dl .pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.dl .pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform var(--d-ui) var(--ease-focus)}
.dl[aria-expanded="true"] .pm{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.dl[aria-expanded="true"] .pm::after{transform:translate(-50%,-50%) rotate(0)}

.split>*,.g-2>*,.g-3>*,.g-4>*,.work-grid>*{min-width:0}
h1,h2,h3{overflow-wrap:break-word}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);flex:none}
.logo svg{height:28px;width:auto}
.logo .m{fill:var(--coral)} .logo .w{fill:currentColor}
.nav{display:none;margin-left:auto}
.nav>ul{display:flex;list-style:none;gap:2px;align-items:center}
.nav a,.nav button.navbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;text-decoration:none;background:none;border:0;cursor:pointer;font-weight:500;font-size:.95rem;border-radius:var(--r-pill);position:relative}
.nav a[aria-current="page"]::after,.nav button.navbtn.cur::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:3px;background:var(--coral);clip-path:polygon(0 70%,100% 0,100% 100%,0 100%)}
.nav a:hover,.nav button.navbtn:hover{background:var(--paper-2)}
.navbtn svg{transition:transform var(--d-ui) var(--ease-focus)}
.navbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.hdr-cta{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav + .hdr-cta{margin-left:12px}
.burger{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;display:grid;place-items:center;cursor:pointer}
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--coral);transform-origin:left;transform:scaleX(var(--p,0));clip-path:polygon(0 66%,100% 0,100% 100%,0 100%)}
@container site (min-width: 1000px){ .nav{display:block} .burger{display:none} .hdr-cta{margin-left:12px} }
@container site (max-width: 420px){ .hdr-cta .btn{padding:0 14px} .hdr-cta .btn .dot{display:none} }

/* Mega menu */
.mega{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--sh-2);padding-block:32px 36px}
.mega-grid{display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;gap:32px}
.mega h2{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);margin-bottom:12px}
.mega ul{list-style:none;display:grid;gap:4px}
.mega a{display:block;text-decoration:none;padding:10px 12px;margin-inline:-12px;border-radius:var(--r-field)}
.mega a:hover{background:var(--paper-2)}
.mega a strong{display:block;font-family:var(--f-display);font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
.mega a span{font-size:.86rem;color:var(--muted)}
.mega-feature{background:var(--night);color:var(--night-text);padding:24px;display:flex;flex-direction:column;gap:14px;border-radius:var(--r-panel)}
.mega-feature p{color:var(--night-muted);font-size:.95rem}

/* Mobile drawer */
.drawer{position:fixed;top:0;bottom:0;left:var(--site-l,0px);width:var(--site-w,100%);z-index:120;background:var(--paper);display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;min-height:68px;border-bottom:1px solid var(--line)}
.drawer nav{padding-block:16px 32px;display:flex;flex-direction:column;gap:4px}
.drawer a.dl,.drawer button.dl{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;font-family:var(--f-display);font-size:1.6rem;font-weight:600;letter-spacing:-.02em;text-decoration:none;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;padding:0}
.drawer .sub{padding:8px 0 16px 0;display:grid;gap:2px;border-bottom:1px solid var(--line)}
.drawer .sub a{display:flex;min-height:44px;align-items:center;text-decoration:none;font-size:1.05rem;gap:10px}
.drawer .sub .label{color:var(--muted);margin-top:10px}
.drawer-foot{margin-top:auto;padding-block:24px;display:grid;gap:12px;border-top:1px solid var(--line)}

/* Footer */
.ftr{background:var(--night);color:var(--night-text);padding-block:72px 32px}
.ftr a{text-decoration:none}
.ftr a:hover{text-decoration:underline;text-underline-offset:3px}
.ftr-top{display:grid;gap:40px}
.ftr .logo{color:var(--night-text)}
.ftr-cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.ftr-cols h2{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--night-muted);font-weight:500;margin-bottom:12px}
.ftr-cols ul{list-style:none;display:grid;gap:2px}
.ftr-cols a{display:inline-flex;min-height:40px;align-items:center}
.ftr-markets{display:grid;gap:16px;border-top:1px solid var(--night-line);padding-top:32px;margin-top:48px}
.ftr-market{display:grid;gap:4px;font-size:.92rem}
.ftr-market .clock{font-family:var(--f-mono);font-size:1.5rem;color:var(--night-text)}
.ftr-bottom{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;border-top:1px solid var(--night-line);margin-top:32px;padding-top:24px;font-size:.85rem;color:var(--night-muted)}
@container site (min-width: 760px){ .ftr-cols{grid-template-columns:repeat(4,1fr)} .ftr-markets{grid-template-columns:repeat(3,1fr)} }
@container site (min-width: 1000px){ .ftr-top{grid-template-columns:1.1fr 2fr} }

/* Forms */
.field{display:grid;gap:6px}
.field label,.field legend{font-weight:600;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-field);background:var(--paper);transition:border-color var(--d-micro),box-shadow var(--d-micro)}
.textarea{min-height:120px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:var(--ink)}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:2px solid var(--coral);outline-offset:1px;box-shadow:none;border-radius:var(--r-field)}
.field.err .input,.field.err .select,.field.err .textarea{border-color:var(--error);border-width:2px}
.errmsg{display:none;color:var(--error);font-size:.88rem;font-weight:600;align-items:flex-start;gap:6px}
.field.err .errmsg{display:flex}
.errmsg::before{content:"!";flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--error);color:var(--paper);font-size:.72rem;margin-top:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--coral);flex:none}
.radios{display:grid;gap:8px}
.radio-tile{position:relative}
.radio-tile input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.radio-tile span{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:var(--r-field);font-size:.95rem}
.radio-tile span::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:none;transition:border var(--d-micro)}
.radio-tile input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio-tile input:checked+span::before{border:6px solid var(--coral)}
.radio-tile input:focus-visible+span{outline:2px solid var(--coral);outline-offset:2px}
.errsum{border:2px solid var(--error);padding:16px 18px;border-radius:var(--r-field);background:color-mix(in srgb, var(--error) 8%, var(--paper))}
.errsum h3{font-family:var(--f-text);font-size:1rem;letter-spacing:0;margin-bottom:6px}
.errsum ul{padding-left:18px}
.errsum a{color:var(--error);font-weight:600}
.ok{border:2px solid var(--success);padding:24px;border-radius:var(--r-panel);background:color-mix(in srgb, var(--success) 8%, var(--paper))}

/* Disclosure / accordion */
.acc{border-top:1px solid var(--line)}
.acc-item{border-bottom:1px solid var(--line)}
.acc-item h3{font-size:inherit;letter-spacing:0}
.acc-btn{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;min-height:64px;padding:16px 0;background:none;border:0;text-align:left;cursor:pointer;font-family:var(--f-display);font-size:clamp(1.05rem, 1rem + .4cqi, 1.3rem);font-weight:600;letter-spacing:-.01em}
.acc-btn .pm{width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;flex:none;position:relative;transition:background var(--d-ui),transform var(--d-ui) var(--ease-focus)}
.acc-btn .pm::before,.acc-btn .pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.acc-btn .pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform var(--d-ui) var(--ease-focus)}
.acc-btn[aria-expanded="true"] .pm{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.acc-btn[aria-expanded="true"] .pm::after{transform:translate(-50%,-50%) rotate(0)}
.acc-panel{padding:0 0 22px;max-width:68ch;color:var(--muted)}
.night .acc,.night .acc-item{border-color:var(--night-line)}
.night .acc-panel{color:var(--night-muted)}

/* Generic grids */
.g{display:grid;gap:24px}
.g-2,.g-3,.g-4{display:grid;gap:24px}
@container site (min-width: 760px){ .g-2{grid-template-columns:1fr 1fr;gap:32px} .g-3{grid-template-columns:repeat(2,1fr)} .g-4{grid-template-columns:repeat(2,1fr)} }
@container site (min-width: 1000px){ .g-3{grid-template-columns:repeat(3,1fr)} .g-4{grid-template-columns:repeat(4,1fr)} }
.split{display:grid;gap:32px}
@container site (min-width: 1000px){ .split{grid-template-columns:5fr 7fr;gap:64px;align-items:start} .split.rev{grid-template-columns:7fr 5fr} .sticky-col{position:sticky;top:100px} }
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:32px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sec-head{display:grid;gap:16px;margin-bottom:clamp(32px, 5cqi, 64px)}
@container site (min-width: 1000px){ .sec-head.side{grid-template-columns:1fr 1fr;align-items:end} .sec-head.side>p{justify-self:end} }
.rule{border:0;border-top:1px solid var(--line);margin:0}

/* Breadcrumb */
.crumbs{font-size:.85rem;padding-top:24px}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--muted);display:inline-flex;min-height:32px;align-items:center}
.crumbs a:hover{color:inherit;text-decoration:underline}
.night .crumbs a,.night .crumbs li+li::before{color:var(--night-muted)}

/* Page hero (inner pages) */
.phero{padding-block:24px clamp(56px, 8cqi, 112px)}
.phero h1{margin-top:clamp(24px, 4cqi, 56px)}
.phero .lead{margin-top:24px}
.phero .row{margin-top:32px}

/* ---- HOME HERO: Signature 1, the Focus Lens ---- */
.hero{padding-block:clamp(40px, 6cqi, 88px) clamp(56px, 7cqi, 104px);overflow:hidden;position:relative}
.hero-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.lens-stage{position:relative;margin-top:clamp(28px, 4cqi, 56px);cursor:default;touch-action:pan-y}
.lens-stage .t-display{padding:.06em 0 .12em}
.lens-layer{position:absolute;inset:-64px 0;padding-block:64px;background:var(--coral);color:var(--on-coral);clip-path:circle(var(--lr,110px) at var(--lx,70%) var(--ly,70%));pointer-events:none}
.lens-ring{position:absolute;left:0;top:0;width:calc(var(--lr,110px) * 2 + 18px);aspect-ratio:1;border:2px solid var(--coral-on-night);border-radius:50%;transform:translate(calc(var(--lxp,0px) - 50%), calc(var(--lyp,0px) - 50%));pointer-events:none}
.lens-ring::after{content:"";position:absolute;right:12%;top:6%;width:9px;height:9px;border-radius:50%;background:var(--coral-on-night)}
.hero-foot{display:grid;gap:28px;margin-top:clamp(28px, 4cqi, 56px)}
.hero-foot .lead{color:var(--night-muted)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--f-mono);font-size:.78rem;color:var(--night-muted);letter-spacing:.04em}
@container site (min-width: 1000px){ .hero-foot{grid-template-columns:1.2fr 1fr;align-items:end} .hero-foot .cta-col{justify-self:end;display:grid;gap:14px;justify-items:end} }

/* Home: service spectrum */
.spectrum{list-style:none;border-top:1px solid var(--line);position:relative}
.spectrum li{border-bottom:1px solid var(--line)}
.spectrum a{display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center;padding:20px 0;text-decoration:none;position:relative}
.spectrum .grp{grid-column:1/-1;order:-1}
.spectrum .nm{font-family:var(--f-display);font-size:clamp(1.6rem, 1rem + 3.4cqi, 4rem);font-weight:600;letter-spacing:-.035em;line-height:1;grid-column:1/3;transition:color var(--d-ui),transform var(--d-ui) var(--ease-focus)}
.spectrum .ds{grid-column:1/3;color:var(--muted);font-size:.95rem;max-width:46ch}
.spectrum .go{grid-row:2/4;grid-column:3;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;transition:all var(--d-ui) var(--ease-focus)}
.spectrum a:hover .nm{color:var(--coral-text);transform:translateX(8px)}
.spectrum a:hover .go{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
@container site (min-width: 1000px){
  .spectrum a{grid-template-columns:140px 1fr 360px 56px;padding:26px 0}
  .spectrum .grp{grid-column:1;order:0}
  .spectrum .nm{grid-column:2}
  .spectrum .ds{grid-column:3}
  .spectrum .go{grid-row:auto;grid-column:4}
}
.peek{position:absolute;width:220px;aspect-ratio:1;border-radius:50%;overflow:hidden;pointer-events:none;z-index:3;left:0;top:0;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity var(--d-ui),transform var(--d-ui) var(--ease-focus);box-shadow:0 0 0 2px var(--coral)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.peek .ph{--ar:1/1;height:100%;align-items:center;justify-content:center;text-align:center}

/* Home: suppliers vs one team */
.versus{display:grid;gap:0;border:1px solid var(--line)}
.versus>div{padding:28px}
.versus>div+div{border-top:1px solid var(--line)}
.versus ul{list-style:none;display:grid;gap:14px;margin-top:20px}
.versus li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.versus .them li::before{content:"";width:16px;height:16px;margin-top:4px;border-radius:50%;border:1.5px dashed var(--line-strong)}
.versus .us{background:var(--night);color:var(--night-text)}
.versus .us li::before{content:"";width:16px;height:16px;margin-top:4px;border-radius:50%;border:2px solid var(--coral-on-night);box-shadow:inset 0 0 0 3px var(--night),inset 0 0 0 8px var(--coral-on-night)}
@container site (min-width: 760px){ .versus{grid-template-columns:1fr 1fr} .versus>div+div{border-top:0;border-left:1px solid var(--line)} .versus>div{padding:40px} }

/* Work tiles */
.work-grid{display:grid;gap:40px 24px}
@container site (min-width: 760px){ .work-grid{grid-template-columns:1fr 1fr} .work-grid .wide{grid-column:1/-1} }
@container site (min-width: 1000px){ .work-grid.three{grid-template-columns:repeat(3,1fr)} .work-grid.three .wide{grid-column:span 2} }
.tile{display:grid;gap:14px;text-decoration:none}
.tile .frame{position:relative;overflow:hidden}
.tile .frame .ph{transition:transform var(--d-reveal) var(--ease-focus)}
.tile .reveal{position:absolute;inset:0;background:var(--coral);color:var(--on-coral);clip-path:circle(0 at var(--mx,85%) var(--my,85%));transition:clip-path var(--d-reveal) var(--ease-focus);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;gap:6px}
.tile:hover .reveal,.tile:focus-visible .reveal{clip-path:circle(150% at var(--mx,85%) var(--my,85%))}
.tile .reveal .big{font-family:var(--f-display);font-size:clamp(1.4rem, 1rem + 1.4cqi, 2.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.05}
.tile h3{font-size:clamp(1.2rem, 1rem + .8cqi, 1.6rem)}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px 14px}

/* Process strip */
.steps{list-style:none;display:grid;gap:0;counter-reset:st;position:relative}
.steps>li{display:grid;grid-template-columns:56px 1fr;gap:16px;padding-bottom:32px;position:relative}
.steps>li::before{counter-increment:st;content:"0" counter(st);width:56px;height:56px;border-radius:50%;border:2px solid var(--coral);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;background:var(--paper);position:relative;z-index:1}
.night .steps>li::before{background:var(--night);border-color:var(--coral-on-night)}
.steps>li::after{content:"";position:absolute;left:27px;top:56px;bottom:0;width:2px;background:linear-gradient(var(--coral),transparent)}
.steps>li:last-child::after{display:none}
.steps h3{font-size:1.35rem;margin:12px 0 8px}
@container site (min-width: 1000px){
  .steps.h{grid-template-columns:repeat(5,1fr);gap:24px}
  .steps.h>li{grid-template-columns:1fr;padding-bottom:0}
  .steps.h>li::after{left:56px;right:-24px;top:27px;bottom:auto;width:auto;height:2px;background:linear-gradient(90deg,var(--coral),transparent)}
}

/* Market panels & clocks */
.mk{display:grid;gap:0;border:1px solid var(--night-line)}
.mk>*{padding:28px}
.mk>*+*{border-top:1px solid var(--night-line)}
@container site (min-width: 760px){ .mk{grid-template-columns:1fr 1fr} .mk>*+*{border-top:0;border-left:1px solid var(--night-line)} .mk>.mk-global{grid-column:1/-1;border-left:0;border-top:1px solid var(--night-line)} .mk>*{padding:40px} }
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(2rem, 1.4rem + 2.6cqi, 3.5rem);font-weight:400;letter-spacing:-.03em;line-height:1}
.tz{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em}
.overlap{margin-top:16px}
.ov-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;min-height:36px}
.ov-track{position:relative;height:16px;background:color-mix(in srgb, currentColor 10%, transparent);border-radius:var(--r-pill)}
.ov-bar{position:absolute;top:0;bottom:0;border-radius:var(--r-pill);background:currentColor;opacity:.55}
.ov-bar.both{background:var(--coral);opacity:1}
.ov-scale{display:flex;justify-content:space-between;margin-left:108px;font-family:var(--f-mono);font-size:.7rem;opacity:.85}

/* Quote */
.quote{font-family:var(--f-display);font-size:clamp(1.6rem, 1rem + 2.8cqi, 3.4rem);line-height:1.12;letter-spacing:-.03em;font-weight:500;max-width:22ch}
.quote-mark{width:56px;height:56px;border-radius:50%;border:2px solid var(--coral);display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;color:var(--coral-text);line-height:1}
.night .quote-mark{border-color:var(--coral-on-night);color:var(--coral-on-night)}
.person{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;--ar:1/1}
.avatar.ph .cap{display:none}

/* Posts */
.post{display:grid;gap:12px;text-decoration:none;border-top:1px solid var(--line);padding-top:20px}
.post h3{font-size:clamp(1.15rem, 1rem + .6cqi, 1.45rem);line-height:1.2;transition:color var(--d-ui)}
.post:hover h3{color:var(--coral-text)}
.post .meta{display:flex;gap:12px;flex-wrap:wrap}

/* Final CTA */
.cta-band{position:relative;overflow:hidden}
.cta-band .big-ring{position:absolute;right:-12cqi;top:50%;width:min(60cqi,720px);aspect-ratio:1;border:2px solid var(--coral);border-radius:50%;transform:translateY(-50%);opacity:.9;pointer-events:none}
.cta-band .big-ring::before{content:"";position:absolute;inset:18%;border:1px solid var(--coral);border-radius:50%;opacity:.5}
.cta-inner{position:relative;display:grid;gap:28px;max-width:860px}

/* Filters */
.filters{display:grid;gap:16px;padding:20px;border:1px solid var(--line);background:var(--paper)}
.filters .fg{display:grid;gap:8px}
@container site (min-width: 1000px){ .filters{grid-template-columns:repeat(3,1fr) auto;align-items:end} }
.filters-bar{position:sticky;top:69px;z-index:5;background:var(--paper);padding-block:12px}
.count{font-family:var(--f-mono);font-size:.85rem}
.empty{border:1.5px dashed var(--line-strong);padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}

/* Segmented control */
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--paper-2);border:1px solid var(--line);gap:4px;max-width:100%}
.seg button{flex:1 1 auto;white-space:nowrap}
.formcard .seg{display:flex}
.seg button{min-height:44px;padding:0 14px;border-radius:var(--r-pill);border:0;background:transparent;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

/* Contact form */
.formcard{border:1px solid var(--line);background:var(--paper);padding:clamp(20px, 3cqi, 40px);display:grid;gap:28px}
.stepper{list-style:none;display:flex;gap:8px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.stepper li .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem}
.stepper li[aria-current="step"]{color:var(--ink);font-weight:600}
.stepper li[aria-current="step"] .n{border-color:var(--coral);background:var(--coral);color:var(--on-coral)}
.stepper li.done .n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stepper li+li::before{content:"";width:24px;height:1.5px;background:var(--line-strong)}
.slots{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.slot span{flex-direction:column;align-items:flex-start;gap:2px;font-size:.85rem}
.slot span::before{display:none}
.slot b{font-family:var(--f-mono);font-weight:500;font-size:.95rem}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days .radio-tile span{min-width:84px;flex-direction:column;align-items:flex-start;gap:0}
.days .radio-tile span::before{display:none}
.days{scrollbar-width:thin}

/* Legal */
.legal-note{border:2px dashed var(--warning);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.legal-note strong{color:var(--warning)}
.toc{list-style:none;display:grid;gap:2px;font-size:.92rem;counter-reset:toc}
.toc a{display:flex;min-height:40px;align-items:center;text-decoration:none;color:var(--muted);gap:10px}
.toc a:hover{color:var(--ink)}
.toc a::before{counter-increment:toc;content:counter(toc,decimal-leading-zero);font-family:var(--f-mono);font-size:.75rem}
.legal h2{font-size:1.5rem;margin:48px 0 14px;scroll-margin-top:96px}
.legal p,.legal li{color:var(--muted);max-width:68ch}
.legal ul{padding-left:20px;display:grid;gap:6px;margin-top:10px}

/* Article */
.article-body{font-size:1.1rem;line-height:1.75;max-width:68ch}
.article-body h2{font-size:1.8rem;margin:2em 0 .6em;scroll-margin-top:96px}
.article-body p+p{margin-top:1.1em}
.article-body ul{padding-left:22px;margin:1em 0;display:grid;gap:8px}
.callout{border-left:0;background:var(--tint);padding:22px 24px;margin:1.6em 0;display:grid;gap:8px;border-radius:var(--r-frame)}

/* Roles list */
.roles{list-style:none;border-top:1px solid var(--line)}
.roles a{display:grid;gap:6px 24px;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.roles a:hover h3{color:var(--coral-text)}
@container site (min-width: 760px){ .roles a{grid-template-columns:2fr 1fr 1fr 48px} }

/* Team */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@container site (min-width: 760px){ .team{grid-template-columns:repeat(3,1fr)} }
@container site (min-width: 1000px){ .team{grid-template-columns:repeat(4,1fr)} }
.team .ph{--ar:4/5}

/* 404 */
.lost{min-height:60vh;display:grid;align-content:center;gap:28px;padding-block:80px}
.blur-ring{width:clamp(160px, 30cqi, 320px);aspect-ratio:1;border-radius:50%;border:3px solid var(--coral);filter:blur(6px);animation:refocus 3.2s var(--ease-move) infinite alternate}
@keyframes refocus{to{filter:blur(0);transform:scale(.92)}}

/* Annotations layer (review only) */
.anno{display:none}
html.notes .anno{display:block;font-family:var(--f-mono);font-size:.78rem;line-height:1.5;color:var(--ink);background:color-mix(in srgb, var(--warning) 12%, var(--paper));border:1.5px dashed var(--warning);padding:12px 14px;margin-block:16px;max-width:100%;letter-spacing:0;text-transform:none;font-weight:400}
html.notes .night .anno{color:var(--night-text);background:color-mix(in srgb, var(--warning) 18%, var(--night))}
.anno b{color:var(--warning);font-weight:500}
.night .anno b{color:var(--warning)}
.pagespec{display:none}
html.notes .pagespec{display:block}

/* Spec pages */
.spec h2{margin:0 0 20px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.sw{border:1px solid var(--line);display:grid}
.sw .chipc{height:96px}
.sw div{padding:12px;font-size:.82rem;display:grid;gap:2px}
.sw code{font-family:var(--f-mono);font-size:.78rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:560px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);background:var(--paper-2)}

  title: 'Accessible by default: a practical starting point for small business websites',

    ['The standard to aim for', ['The usual benchmark is the Web Content Accessibility Guidelines (WCAG), published by the W3C. Version 2.2 is the current version, and level AA is the level most organisations aim for. You don’t need to read all of it to make progress. A handful of habits cover a lot of ground.', { q: 'The fixes that help people with disability usually make a site easier for everyone.' }]],

const LEN = { any: ['Any length', () => true], quick: ['Quick reads (2 min)', p => p.mins <= 2], longer: ['Longer reads (3 min+)', p => p.mins >= 3] };

  const draw = (announce) => {

    res.innerHTML = total ? (BLOG.view === 'grid' ? showing.map(bCard).join('') : `<ol class="bindex" style="list-style:none">${showing.map(bRow).join('')}</ol>`)

    more.hidden = total <= BLOG.shown;
    more.textContent = `Load more articles (${total - Math.min(total, BLOG.shown)} more)`;
    const f = BLOG_POSTS.find(p => p.featured);
    cnt.textContent = filtersActive() ? `${total} ${total === 1 ? 'article matches' : 'articles match'}` : `${total} more articles, newest first (plus the featured article above)`;
    if (filtersActive() && BLOG.sort !== 'new') cnt.textContent = `${total} ${total === 1 ? 'article matches' : 'articles match'}, ${sort.options[sort.selectedIndex].text.toLowerCase()}`;
    // pills

    $('.dial-dot').style.setProperty('--a', ang + 'deg'); const dl = $('[data-dial]'); dl.style.setProperty('--rad', (dl.offsetWidth * .41) + 'px');

  <div class="stack-lg prose"><p class="lead">Most small businesses are not invisible because they are quiet. They are invisible because they are blurred: an inconsistent logo, a slow website, scattered content. Spotflair’s job is to bring a business into focus, so the right people notice it and trust it.</p>
  <p>So the website behaves like a lens. Content arrives the way an image comes into focus: a ring opens, the picture sharpens, a coral mark lands. It borrows the two shapes Spotflair already owns: the <strong>ring</strong> from the splash screen and the <strong>comet trail</strong> from the logo. It avoids every cliché in the brief: no spotlights, curtains, lens flares or sparkle icons.</p>

    <div class="spec-card"><p class="label c-coral">Signature 2</p><h3 class="t-3">The Trail</h3><p class="muted">The tapered comet tail from the logo, used as a mark of movement and progress: the scroll-progress line under the header, the underline that lands under one key phrase per page, the active nav indicator and the connector between process steps.</p><a class="link" href="#process">See it on Process ${I.arrow}</a></div>

<section class="band spec"><div class="wrap split">

  <ul class="check-list">

function offsetMin(tz, d = new Date()) { const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(d).map(x => [x.type, x.value])); return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - d.getTime()) / 60000); }
const auLabel = d => offsetMin(TZ.AU, d) === 660 ? 'AEDT' : 'AEST';
const fmtTime = (tz, d = new Date()) => new Intl.DateTimeFormat('en-AU', { timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true }).format(d).replace(/\s/g, ' ');
function tick() {
  $$('[data-clock]').forEach(el => { el.textContent = fmtTime(TZ[el.dataset.clock]); });
  $$('[data-tzlabel="AU"]').forEach(el => el.textContent = auLabel());
}
const hm = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const ap = hh >= 12 ? 'pm' : 'am'; const h12 = ((hh + 11) % 12) + 1; return `${h12}:${String(mm).padStart(2, '0')} ${ap}`; };

function drawOverlap() {
  const o = overlapCalc(), pct = h => (Math.max(0, h) / 24 * 100) + '%', w = (a, b) => (Math.max(0, b - a) / 24 * 100) + '%';
  $$('[data-overlap]').forEach(el => {
    $('[data-ov="lk"]', el).style.cssText = `left:${pct(9)};width:${w(9, 17)}`;
    $('[data-ov="au"]', el).style.cssText = `left:${pct(o.au[0])};width:${w(Math.max(0, o.au[0]), o.au[1])}`;
    $('[data-ov="both"]', el).style.cssText = `left:${pct(o.both[0])};width:${w(o.both[0], o.both[1])}`;
    $('[data-ov-text]', el).innerHTML = `Best time to meet: <strong>${hm(o.both[0])} to ${hm(o.both[1])} SLST</strong>, which is <strong>${hm(o.both[0] + o.diff)} to ${hm(o.both[1] + o.diff)} ${auLabel()}</strong> in Sydney. Sydney is ${o.diff} hours ahead of Colombo right now.`;

  const drawDays = () => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ.LK, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(x => [x.type, x.value]));
    const days = []; let i = 1; while (days.length < 5) { const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day + i)); if (d.getUTCDay() % 6 !== 0) days.push(d); i++; }
    $('[data-days]').innerHTML = days.map((d, j) => `<label class="radio-tile"><input type="radio" name="day" value="${d.toISOString().slice(0, 10)}"><span><strong>${d.toLocaleDateString('en-AU', { weekday: 'short', timeZone: 'UTC' })}</strong><span class="small">${d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</span></span></label>`).join('');
    $$('[name=day]', form).forEach(r => r.addEventListener('change', drawSlots));
    $('[data-slots]').innerHTML = '<p class="small muted">Choose a day to see times.</p>';
  };
  const drawSlots = () => {
    const day = (form.querySelector('[name=day]:checked') || {}).value; if (!day) return;
    const [y, m, d] = day.split('-').map(Number); const o = overlapCalc(); const out = [];
    for (let h = o.both[0]; h + .5 <= o.both[1]; h += .5) { const utc = new Date(Date.UTC(y, m - 1, d, 0, 0) + (h - 5.5) * 3600000); out.push(`<label class="radio-tile slot"><input type="radio" name="slot" value="${utc.toISOString()}"><span><b>${fmtTime(TZ.LK, utc)} SLST</b><span class="muted">${fmtTime(TZ.AU, utc)} ${auLabel(utc)}</span></span></label>`); }
    $('[data-slots]').innerHTML = out.join('');
  };
  const draw = () => {
    const names = steps();
    stepper.innerHTML = names.map((n, i) => `<li ${i + 1 === step ? 'aria-current="step"' : ''} class="${i + 1 < step ? 'done' : ''}"><span class="n">${i + 1 < step ? '✓' : i + 1}</span>${n}<span class="vh">${i + 1 < step ? ' (completed)' : ''}</span></li>`).join('');
    $$('[data-step]', form).forEach(fs => fs.hidden = +fs.dataset.step !== step);
    $('[data-back]').hidden = step === 1;
    const last = step === names.length;
    $('[data-consent]').hidden = !last;
    $('[data-next]').innerHTML = last ? (state.mode === 'call' ? 'Book my call' : 'Send enquiry') + ' <span class="dot" aria-hidden="true"></span>' : 'Continue <span class="dot" aria-hidden="true"></span>';
    $('[data-msg-opt]').textContent = state.mode === 'enquiry' ? '' : '(optional)';
    $$('[data-fmode]', card).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fmode === state.mode)));
    if (step === 3) drawDays();
  };
  const setErr = (id, bad) => { const f = $('#' + id); f.classList.toggle('err', bad); const ctl = f.querySelector('input,select,textarea'); if (ctl && !f.matches('fieldset') && f.querySelector('.input,.textarea')) ctl.setAttribute('aria-invalid', String(bad)); return bad; };
  const validate = () => {
    const errs = [];
    const chk = (id, bad, msg) => { if (setErr(id, bad)) errs.push([id, msg]); };
    if (step === 1) {
      chk('f-svc-f', !form.querySelector('[name=svc]:checked'), 'Choose at least one service');
      chk('f-country-f', !form.querySelector('[name=country]:checked'), 'Choose where your business is based');
      chk('f-budget-f', !form.querySelector('[name=budget]:checked'), 'Choose a budget range');
      chk('f-time-f', !form.querySelector('[name=timeline]:checked'), 'Choose when you’d like to start');
    }
    if (step === 2) {
      chk('f-name-f', !$('#f-name').value.trim(), 'Enter your name');
      chk('f-email-f', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('#f-email').value.trim()), 'Enter a valid email address');
      chk('f-msg-f', state.mode === 'enquiry' && $('#f-msg').value.trim().length < 10, 'Add a short description of your project');
    }
    if (step === 3) {
      chk('f-day-f', !form.querySelector('[name=day]:checked'), 'Choose a day');
      chk('f-slot-f', !form.querySelector('[name=slot]:checked'), 'Choose a time');
    }
    if (step === steps().length) chk('f-ok-f', !$('#f-ok').checked, 'Tick the consent box so we can reply');
    const sum = $('[data-errsum]');
    if (errs.length) {
      sum.innerHTML = `<div class="errsum" tabindex="-1" role="alert"><h3>There ${errs.length === 1 ? 'is 1 thing' : `are ${errs.length} things`} to fix</h3><ul>${errs.map(([id, m]) => `<li><a href="#s-${id}" data-fix="${id}">${m}</a></li>`).join('')}</ul></div>`;
      $$('[data-fix]', sum).forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); const f = $('#' + a.dataset.fix); const c = f.querySelector('input:not([type=hidden]),select,textarea'); c && c.focus(); }));
      $('.errsum', sum).focus();
      return false;
    }
    sum.innerHTML = ''; return true;
  };
  form.addEventListener('change', e => { if (e.target.name === 'country') drawBudgets(); const f = e.target.closest('.field.err'); if (f) { f.classList.remove('err'); } });
  form.addEventListener('submit', e => {
    e.preventDefault(); if (!validate()) return;
    if (step < steps().length) { step++; draw(); const lg = $(`[data-step="${step}"] legend`, form); lg.setAttribute('tabindex', '-1'); lg.focus(); return; }
    const done = $('[data-done]'); const name = $('#f-name').value.trim().split(' ')[0];
    const slot = (form.querySelector('[name=slot]:checked') || {}).value;
    const when = slot ? `<p><strong>${new Date(slot).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ.LK })}</strong>, ${fmtTime(TZ.LK, new Date(slot))} SLST / ${fmtTime(TZ.AU, new Date(slot))} ${auLabel(new Date(slot))}</p>` : '';
    form.hidden = true; stepper.hidden = true; $('.seg', card).hidden = true;
    done.hidden = false;
    done.innerHTML = `<p class="label" style="color:var(--success)">${state.mode === 'call' ? 'Call requested' : 'Enquiry received'}</p><h2 class="t-2">Thanks, ${name}. We’ve got it.</h2>${when}<p class="muted">You’ll get a confirmation at ${$('#f-email').value.trim()} shortly, and a member of the team will reply within two business days. ${C('response time')}</p><p class="small muted">Prototype: nothing was sent. In production this posts to the CRM and scheduling tool.</p><div class="row"><a class="btn btn-ghost" href="#work">Browse our work while you wait</a><a class="link" href="#process">What happens on the call ${I.arrow}</a></div>`;
    done.focus();
  });
  $('[data-back]').addEventListener('click', () => { step--; $('[data-errsum]').innerHTML = ''; draw(); });
  $$('[data-fmode]', card).forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.fmode; if (step > steps().length) step = steps().length; draw(); }));
  if (state.country) { const r = form.querySelector(`[name=country][value="${state.country}"]`); r && (r.checked = true); state.country = null; }
  drawBudgets(); draw();
}

/* ---- Global link handling (state carried between pages) ---- */
document.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  if (a.dataset.skip !== undefined) { e.preventDefault(); main.focus(); main.scrollIntoView(); return; }
  if (a.dataset.scroll) {
    const el = document.getElementById(a.dataset.scroll);
    const href = a.getAttribute('href');
    if (el && (href.startsWith('#s-') || href === '#' + current)) { e.preventDefault(); scrollToId(a.dataset.scroll); return; }
    state.scrollTo = a.dataset.scroll;
    if (a.dataset.tab) state.tab = a.dataset.tab;
    return;
  }
  if (a.dataset.mode) state.mode = a.dataset.mode;
  if (a.dataset.prefill) state.prefill = [a.dataset.prefill];
  else if (a.getAttribute('href') === '#contact' && a.dataset.mixGo === undefined) state.prefill = state.prefill && current === 'services' ? state.prefill : null;
  if (a.dataset.country) state.country = a.dataset.country;
  if (a.dataset.post) state.post = a.dataset.post;
  if (a.dataset.project) state.project = +a.dataset.project;
  if (a.dataset.tab) state.tab = a.dataset.tab;
  if (a.dataset.filterSvc) state.filterSvc = a.dataset.filterSvc;
  if (a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
});
document.addEventListener('click', e => { const b = e.target.closest('[data-region]'); if (b) setRegion(b.dataset.region); });
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => { const h = document.documentElement; const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight); $('.progress').style.setProperty('--p', p.toFixed(4)); }, { passive: true });
window.addEventListener('resize', sizeFixed);

/* ---- Review bar ---- */
function initReview() {
  const sel = $('#rbPage');
  const label = k => k.startsWith('service-') ? '  ' + svc(k.slice(8)).name : ({ home: 'Home', services: 'Services', work: 'Work', 'case-study': 'Case study (template)', testimonials: 'Testimonials', about: 'About', process: 'Process', markets: 'Markets', blog: 'Blog', 'blog-post': 'Blog article (template)', 'blog-category': 'Blog category (template)', 'blog-spec': '7 · Blog spec', contact: 'Contact / Book a call', careers: 'Careers', privacy: 'Privacy Policy', terms: 'Terms', '404': '404', concept: '1 · Concept', system: '2 · Design system', sitemap: '3 · Sitemap and SEO', notes: '5–6 · Rationale and placeholders' })[k] || k;
  const groups = { 'Pages': ['home', 'services', 'work', 'testimonials', 'about', 'process', 'markets', 'blog', 'contact', 'careers', 'privacy', 'terms', '404'], 'Templates': ['service-web-development', ...SERVICES.filter(s => s.slug !== 'web-development').map(s => 'service-' + s.slug), 'case-study', 'blog-post', 'blog-category'], 'Spec': ['concept', 'system', 'sitemap', 'notes', 'blog-spec'] };
  sel.innerHTML = Object.entries(groups).map(([g, ks]) => `<optgroup label="${g}">${ks.map(k => `<option value="${k}">${label(k)}</option>`).join('')}</optgroup>`).join('');
  sel.addEventListener('change', () => { location.hash = sel.value; });
  $$('[data-w]').forEach(b => b.addEventListener('click', () => { $$('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); const w = +b.dataset.w; document.documentElement.style.setProperty('--pw', w === 1440 ? '1440px' : w + 'px'); document.documentElement.classList.toggle('previewing', w !== 1440); setTimeout(() => { sizeFixed(); if (current === 'home') initLens(); }, 300); }));
  const tog = (id, fn) => { const b = $(id); b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); fn(on); }); };
  tog('#rbNotes', on => document.documentElement.classList.toggle('notes', on));
  tog('#rbMotion', on => { document.documentElement.classList.toggle('rm', on); $$('.pre').forEach(x => x.classList.remove('pre')); });
  const dark = matchMedia('(prefers-color-scheme: dark)').matches; const tb = $('#rbTheme'); tb.setAttribute('aria-pressed', String(dark));
  tb.addEventListener('click', () => { const on = tb.getAttribute('aria-pressed') !== 'true'; tb.setAttribute('aria-pressed', String(on)); document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light'); });
}

/* ---- Boot ---- */
document.querySelectorAll('[data-logo]').forEach(() => {});
buildMega(); buildFooter(); initReview(); route(); sizeFixed();
setInterval(() => { tick(); }, 15000);


</script>
